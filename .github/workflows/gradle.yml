name: Java CI

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout latest code
        uses: actions/checkout@v3
        
      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Set up JDK 17
        uses: actions/setup-java@v2
        with:
          distribution: 'zulu'
          java-version: 17

      # 关键修改：使用 shadowJar 任务而非 build
      - name: Build with Gradle
        run: ./gradlew shadowJar --full-stacktrace

      # 添加调试步骤，列出所有 JAR 文件
      - name: List generated JAR files
        run: find . -name "*.jar"

      # 上传 Shadow JAR（主构建产物）
      - name: Upload Triton Shadow JAR
        uses: actions/upload-artifact@v4
        with:
          name: Triton-Shadow
          path: build/libs/Triton-*.jar
          retention-days: 7

      # 上传其他模块（可选）
      - name: Upload Core Module
        uses: actions/upload-artifact@v4
        with:
          name: Triton-Core
          path: core/build/libs/*.jar

      - name: Upload API Module
        uses: actions/upload-artifact@v4
        with:
          name: Triton-API
          path: api/build/libs/*.jar
